<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Сергей Кузюков — CTO, CDTO, CPO">
  <title>Сергей Кузюков — CTO / CDTO / CPO</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131A23"/>
      <stop offset="0.55" stop-color="#0D1218"/>
      <stop offset="1" stop-color="#0A0E13"/>
    </linearGradient>
    <linearGradient id="signalline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8CA9C7"/>
      <stop offset="1" stop-color="#4F6F95"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#1D2836" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)" opacity="0.55"/>

  <!-- сигнальная трасса печатной платы: левый вывод -> чип -> имя -->
  <path id="trace" d="M0 252 H180 L230 202 H560 L610 152 H1200"
        fill="none" stroke="url(#signalline)" stroke-width="2.5" opacity="0.9"
        stroke-dasharray="1400" stroke-dashoffset="1400">
    <animate attributeName="stroke-dashoffset" from="1400" to="0" dur="2.4s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </path>
  <!-- контактные пады на трассе -->
  <g fill="none" stroke="#8CA9C7" stroke-width="2">
    <circle cx="180" cy="252" r="7" opacity="0">
      <animate attributeName="opacity" from="0" to="0.9" begin="1.1s" dur="0.4s" fill="freeze"/>
    </circle>
    <circle cx="560" cy="202" r="7" opacity="0">
      <animate attributeName="opacity" from="0" to="0.9" begin="1.6s" dur="0.4s" fill="freeze"/>
    </circle>
    <circle cx="610" cy="152" r="7" opacity="0">
      <animate attributeName="opacity" from="0" to="0.9" begin="2s" dur="0.4s" fill="freeze"/>
    </circle>
  </g>
  <!-- бегущий импульс по трассе -->
  <circle cx="0" cy="0" r="5" fill="#F2F5F8" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.9;1" dur="2.4s" fill="freeze"/>
    <animateMotion dur="2.4s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" path="M0 252 H180 L230 202 H560 L610 152 H1200"/>
  </circle>

  <!-- чип-метка -->
  <g font-family="Menlo, Consolas, monospace" font-size="19" fill="#A2ACB7" letter-spacing="3">
    <text x="72" y="52">SYS.ARCHITECT // FINTECH × AI</text>
  </g>

  <text x="70" y="150" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="86" fill="#F2F5F8" letter-spacing="1">Сергей Кузюков</text>

  <rect x="72" y="176" width="64" height="34" fill="none" stroke="#8CA9C7" stroke-width="2"/>
  <text x="82" y="201" font-family="Menlo, Consolas, monospace" font-size="22" font-weight="bold" fill="#8CA9C7">CTO</text>
  <text x="152" y="201" font-family="Menlo, Consolas, monospace" font-size="22" fill="#C8CFD8">/ CDTO / CPO</text>

  <text x="72" y="244" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#A2ACB7">17+ лет в IT — от разработчика до CEO</text>

  <!-- пульс статуса -->
  <circle cx="1128" cy="52" r="8" fill="#8CA9C7">
    <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="1050" y="46" font-family="Menlo, Consolas, monospace" font-size="17" fill="#A2ACB7" text-anchor="end" opacity="0">.</text>
  <text x="1112" y="58" font-family="Menlo, Consolas, monospace" font-size="17" fill="#A2ACB7" text-anchor="end">OPEN</text>
</svg>
